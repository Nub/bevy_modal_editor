[workspace]
resolver = "2"
members = [
    "crates/editor_api",
    "crates/editor_assets",
    "crates/editor_core",
    "crates/editor_scene",
    "crates/editor_prefabs",
    "crates/editor_publish",
    "crates/editor_ui",
    "crates/game_framework",
    "crates/template_game",
    "crates/bevy_outliner",
    # M0 spikes (throwaway code, durable findings — see spikes/README.md)
    "spikes/editqueue-scale",
    "spikes/bsn-foundation",
    "spikes/feathers-shell",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nub/bevy_modal_editor"
version = "0.1.0"

[workspace.dependencies]
# Bevy version policy (spec §8): latest stable, exact-minor pin, upgrades only as
# dedicated phase-boundary PRs.
bevy = { version = "0.19", default-features = true }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"

editor_api = { path = "crates/editor_api" }
editor_assets = { path = "crates/editor_assets" }
editor_prefabs = { path = "crates/editor_prefabs" }
editor_core = { path = "crates/editor_core" }
editor_scene = { path = "crates/editor_scene" }
editor_ui = { path = "crates/editor_ui" }
bevy_outliner = { path = "crates/bevy_outliner" }
game_framework = { path = "crates/game_framework" }

# Dev-profile tuning: without this, debug builds are unusable — wgpu-core's
# debug-assertions lock-tracing captures a symbolicated backtrace on every GPU lock
# (diagnosed via `sample` during M1: first frame never completes on macOS).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
