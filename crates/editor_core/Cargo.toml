[package]
name = "editor_core"
description = "Editor kernel: feature host, modes, input resolver, keymap layering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Gizmos: the selection outline (interim) and viewport overlays draw through the
# Gizmos API. 0.19's feature-profile rework dropped these from the defaults.
bevy = { workspace = true, features = ["bevy_gizmos", "bevy_gizmos_render"] }
editor_api.workspace = true
game_framework.workspace = true
serde.workspace = true
ron.workspace = true

[dev-dependencies]
tempfile = "3"
