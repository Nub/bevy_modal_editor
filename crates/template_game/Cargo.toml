[package]
name = "template_game"
description = "Reference game: living documentation, integration test, and starter kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bevy.workspace = true
game_framework.workspace = true
avian3d = "0.7"
editor_api = { workspace = true, optional = true }
editor_core = { workspace = true, optional = true }
editor_prefabs = { workspace = true, optional = true }
editor_scene = { workspace = true, optional = true }
editor_ui = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[features]
# The editor is an opt-in game feature (spec §1): compile-time flag, never release
# optimization. With the feature off, zero editor code exists in the artifact (CI
# asserts this — M1 acceptance A6). editor_ui carries the whole chrome (and its
# bevy feature requirements: feathers, gizmos) — the game declares only content.
editor = [
    "dep:editor_api",
    "dep:editor_core",
    "dep:editor_scene",
    "dep:editor_ui",
    "dep:uuid",
    "dep:editor_prefabs",
]

[lints]
workspace = true
